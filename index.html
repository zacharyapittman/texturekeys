
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101310">
  <title>TextureKeys</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">T</div>
        <span>TextureKeys</span>
      </div>

      <div class="top-controls">
        <div class="engine-indicator">
          <span class="status-light" id="status-light"></span>
          <span id="engine-status">READY</span>
        </div>
        <button class="utility-button" id="hold-settings-button">
          HOLD TIME <span id="hold-value">1.5s</span>
        </button>
        <button class="utility-button" id="latch-button">
          LATCH <span id="latch-status">OFF</span>
        </button>
      </div>
    </header>

    <section class="layers-section">
      <div class="section-heading">
        <div>
          <h1>Textures</h1>
          <p>Blend your sound layers</p>
        </div>
        <span class="layer-count">4 LAYERS</span>
      </div>

      <div class="layers-grid" id="layers-grid"></div>
    </section>

    <button class="hold-control" id="hold-button"
      aria-label="Press and hold to activate textures">
      <span class="hold-light" id="hold-light"></span>
      <span>HOLD</span>
    </button>

    <div class="hold-popover" id="hold-popover" hidden>
      <div class="popover-heading">
        <strong>Global Hold Time</strong>
        <button id="close-hold-settings" aria-label="Close">×</button>
      </div>
      <div class="hold-time-value" id="hold-popover-value">1500 ms</div>
      <input id="hold-time" type="range" min="0" max="5000"
        step="1" value="1500">
      <div class="range-labels">
        <span>0 ms</span>
        <span>5000 ms</span>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
